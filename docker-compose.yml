# For your own server (VPS or Oracle Cloud). Put SCOUT_DOMAIN=... in a file named .env,
# then start with:  docker compose up -d --build
# Then open https://SCOUT_DOMAIN/setup within 60 minutes to get the Scout app key.
services:
  scout:
    build: .
    restart: unless-stopped
    # Your settings (SCOUT_DOMAIN, MODEL_NAME, SCOUT_NEW_APP_KEY, ...) go in the file .env next to this one.
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_URL: https://${SCOUT_DOMAIN:?Set SCOUT_DOMAIN, for example 1-2-3-4.sslip.io}
      DEMO_MODE: ${DEMO_MODE:-false}
      # Exactly one proxy (Caddy) sits in front of Scout, so faked client addresses are ignored.
      TRUST_PROXY: "1"
    volumes:
      - scout-data:/data
      # Keeps the AI model (about 3 GB) across updates, so it is never downloaded twice.
      - scout-models:/opt/ollama-models
    expose:
      - "7860"

  # Caddy gets a free HTTPS certificate automatically (Let's Encrypt).
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${SCOUT_DOMAIN} --to scout:7860
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - scout

volumes:
  scout-data:
  scout-models:
  caddy-data:
